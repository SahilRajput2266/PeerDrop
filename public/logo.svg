<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Cyan-to-Emerald Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Signal Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Radar Mesh Cross-hairs (Subtle Background) -->
  <circle cx="60" cy="56" r="38" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3" opacity="0.25"/>
  <circle cx="60" cy="56" r="24" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2" opacity="0.3"/>

  <!-- Radiating P2P Sonar Waves -->
  <path d="M 32 38 A 36 36 0 0 1 88 38" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  <path d="M 40 46 A 24 24 0 0 1 80 46" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 48 54 A 14 14 0 0 1 72 54" fill="none" stroke="url(#coreGrad)" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Iconic Central Drop + P2P Mesh Beacon Shape -->
  <path d="M 60 26 C 45 46 44 67 52 77 C 56 82 64 82 68 77 C 76 67 75 46 60 26 Z" 
        fill="url(#coreGrad)" filter="url(#coreGlow)" opacity="0.95"/>

  <!-- Peer Connection Node / Quantum Packet Inner Core -->
  <circle cx="60" cy="63" r="6" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <circle cx="60" cy="63" r="2.5" fill="#030712"/>

  <!-- Dynamic Downward Drop Particle Rays -->
  <line x1="60" y1="83" x2="60" y2="93" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)"/>
  <circle cx="60" cy="99" r="2.5" fill="#10B981" filter="url(#neonGlow)"/>
</svg>

